<!DOCTYPE html>
<html>
<body>
<button id="btn">Play</button>
<script>
let ctx;
document.getElementById('btn').onclick = () => {
    if (!ctx) ctx = new AudioContext();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    
    const now = ctx.currentTime;
    // Ramp to 0 in 1 second
    gain.gain.setValueAtTime(1, now);
    gain.gain.linearRampToValueAtTime(0, now + 1);
    
    osc.start(now);
    // deliberately do NOT call osc.stop() to see if we hear anything after 1s
    
    console.log("Started oscillator. Should be silent after 1s.");
    setTimeout(() => {
        console.log("2 seconds later. Gain is:", gain.gain.value);
    }, 2000);
};
</script>
</body>
</html>
