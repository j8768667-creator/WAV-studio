<!DOCTYPE html>
<html>
<body>
<button id="btn">Play</button>
<script>
let ctx;
document.getElementById('btn').onclick = () => {
    if (!ctx) ctx = new AudioContext();
    const buf = ctx.createBuffer(1, ctx.sampleRate * 10, ctx.sampleRate);
    const data = buf.getChannelData(0);
    for(let i=0; i<data.length; i++) data[i] = Math.random() * 2 - 1; // white noise
    
    const source = ctx.createBufferSource();
    source.buffer = buf;
    const gain = ctx.createGain();
    
    const scheduledTime = ctx.currentTime + 0.1;
    const safeDuration = 1.0;
    const fadeDur = 0.015;
    
    gain.gain.setValueAtTime(0, scheduledTime);
    gain.gain.linearRampToValueAtTime(1.0, scheduledTime + 0.005);
    
    gain.gain.setValueAtTime(1.0, scheduledTime + safeDuration - fadeDur);
    gain.gain.linearRampToValueAtTime(0, scheduledTime + safeDuration);
    
    source.connect(gain);
    gain.connect(ctx.destination);
    
    source.start(scheduledTime, 0);
    source.stop(scheduledTime + safeDuration);
    console.log("Triggered");
};
</script>
</body>
</html>
