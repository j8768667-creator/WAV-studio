<!DOCTYPE html>
<html>
<head>
    <style>
        .fader-wrapper {
            position: relative;
            width: 20px;
            height: 80px; /* the desired vertical height */
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .fader-wrapper input[type=range] {
            transform: rotate(-90deg);
            width: 80px; /* this becomes the visual height */
            height: 20px;
            margin: 0;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="fader-wrapper">
        <input type="range" min="0" max="2" step="0.05">
    </div>
</body>
</html>
